<!DOCTYPE html>

<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Joana Come a Tapa — Menu</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
/* ════════════════════════════════════════════
   VARIABLES & RESET
════════════════════════════════════════════ */
:root {
  --bg: #ffffff;
  --card: #f9f7f4;
  --char: #1a1a1a;
  --mid: #555;
  --muted: #999;
  --gold: #b8873a;
  --gold-bg: #fdf8ef;
  --rust: #b83232;
  --green: #2e7d4f;
  --red: #c0392b;
  --border: #e8e2da;
  --shadow: 0 2px 12px rgba(0,0,0,.07);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:16px;scroll-behavior:smooth}
body{background:var(--bg);font-family:'Jost',sans-serif;color:var(--char);min-height:100vh;overflow-x:hidden}
body::before{content:'';position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),#d4a855,var(--gold));z-index:999}
input,textarea,select,button{font-family:'Jost',sans-serif}

/* ════════════════════════════════════════════
LOADING SCREEN
════════════════════════════════════════════ */
#loadScreen{position:fixed;inset:0;background:#fff;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;transition:opacity .4s}
#loadScreen.fade{opacity:0;pointer-events:none}
.load-logo{width:64px;height:64px;border-radius:50%;background:#1a1a1a;display:flex;align-items:center;justify-content:center}
.load-letter{font-family:‘Cormorant Garamond’,serif;font-size:1.8rem;color:var(–gold)}
.load-text{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(–muted)}
.load-bar{width:120px;height:2px;background:#eee;border-radius:2px;overflow:hidden}
.load-bar-inner{height:100%;background:var(–gold);border-radius:2px;animation:loadprogress 1.2s ease forwards}
@keyframes loadprogress{from{width:0}to{width:100%}}

/* ════════════════════════════════════════════
LANG BAR
════════════════════════════════════════════ */
.lang-bar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:500;display:flex;gap:2px;background:#fff;border:1px solid var(–border);border-radius:24px;padding:3px;box-shadow:var(–shadow)}
.lang-btn{border:none;background:transparent;padding:5px 14px;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(–muted);cursor:pointer;border-radius:18px;transition:all .2s}
.lang-btn.active{background:var(–char);color:#fff}

/* ════════════════════════════════════════════
MENU PAGE
════════════════════════════════════════════ */
#menuPage{max-width:600px;margin:0 auto;padding:62px 18px 100px}

/* HEADER */
.header{text-align:center;margin-bottom:40px}
.logo-ring{width:82px;height:82px;border-radius:50%;background:var(–char);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;box-shadow:0 6px 24px rgba(0,0,0,.18);position:relative}
.logo-ring::after{content:’’;position:absolute;inset:-5px;border-radius:50%;border:1.5px solid rgba(184,135,58,.4)}
.logo-letter{font-family:‘Cormorant Garamond’,serif;font-size:2rem;font-weight:400;color:var(–gold)}
.rest-name{font-family:‘Cormorant Garamond’,serif;font-size:1.9rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;line-height:1.1}
.rest-sub{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(–muted);margin-top:6px}
.hline{display:flex;align-items:center;gap:12px;margin:18px 0 0}
.hline span{flex:1;height:1px;background:var(–border)}
.hline i{font-style:normal;font-size:11px;color:var(–gold)}

/* SECTION */
.sec-block{margin-bottom:32px;border-radius:14px;overflow:hidden;border:1px solid var(–border);box-shadow:var(–shadow)}
.sec-header{display:flex;align-items:center;gap:12px;padding:15px 18px;background:var(–char)}
.sec-icon{font-size:1.3rem;flex-shrink:0}
.sec-name{font-family:‘Cormorant Garamond’,serif;font-size:1.45rem;font-weight:600;color:#fff;line-height:1.1}
.sec-sub{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.5);margin-top:2px}

/* SUBCAT */
.subcat-label{font-size:10px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(–gold);padding:11px 18px 5px;background:var(–gold-bg);border-top:1px solid #ede5d5;border-bottom:1px solid #ede5d5}

/* ITEM */
.menu-item{display:flex;align-items:flex-start;gap:10px;padding:12px 18px;border-bottom:1px solid var(–border);background:#fff;transition:background .15s}
.menu-item:last-child{border-bottom:none}
.menu-item.unavail{opacity:.4;background:#fafafa}
.mi-left{flex:1;min-width:0}
.mi-name{font-size:15px;font-weight:500;line-height:1.3;color:var(–char)}
.mi-unavail{font-size:11px;color:var(–muted);font-weight:400;margin-left:5px}
.mi-desc{font-size:12px;color:var(–mid);margin-top:3px;line-height:1.4;font-style:italic}
.mi-allerg{font-size:11px;color:var(–muted);margin-top:3px;line-height:1.4}
.mi-price{font-size:15px;font-weight:700;color:var(–rust);white-space:nowrap;flex-shrink:0;padding-top:1px}

/* FOOTER */
.menu-footer{text-align:center;margin-top:36px;padding-top:20px;border-top:1px solid var(–border);font-size:12px;letter-spacing:.15em;text-transform:uppercase;color:var(–muted)}

/* ════════════════════════════════════════════
FABS
════════════════════════════════════════════ */
.fabs{position:fixed;bottom:20px;right:16px;z-index:400;display:flex;flex-direction:column;gap:8px}
.fab{border-radius:24px;padding:11px 16px;font-size:13px;font-weight:600;cursor:pointer;border:none;white-space:nowrap;box-shadow:0 3px 12px rgba(0,0,0,.18);letter-spacing:.04em}
.fab-admin{background:var(–char);color:var(–gold)}
.fab-qr{background:#fff;color:var(–char);border:1px solid var(–border)}

/* ════════════════════════════════════════════
ADMIN PANEL
════════════════════════════════════════════ */
#adminPanel{display:none;position:fixed;inset:0;z-index:800;background:#f2efe9;overflow-y:auto;padding-bottom:80px}
#adminPanel.open{display:block}

.ap-topbar{position:sticky;top:0;z-index:10;background:#1a1a1a;padding:0 16px;display:flex;align-items:center;gap:8px;height:56px;border-bottom:3px solid var(–gold)}
.ap-title{font-family:‘Cormorant Garamond’,serif;font-size:1.2rem;font-weight:600;color:var(–gold);flex:1}
.ap-saved-msg{font-size:11px;color:var(–gold);opacity:0;transition:opacity .3s;white-space:nowrap}
.ap-saved-msg.show{opacity:1}
.ap-topbtn{border:none;border-radius:8px;padding:8px 14px;font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.04em}
.ap-topbtn-gold{background:var(–gold);color:#fff}
.ap-topbtn-white{background:rgba(255,255,255,.12);color:#fff}

/* section tabs */
.ap-tabs{display:flex;gap:6px;padding:12px 14px;overflow-x:auto;background:#fff;border-bottom:1px solid var(–border);-webkit-overflow-scrolling:touch}
.ap-tabs::-webkit-scrollbar{display:none}
.ap-tab{border:1px solid var(–border);border-radius:20px;padding:7px 13px;font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;background:#fff;color:var(–muted);transition:all .2s;flex-shrink:0;letter-spacing:.04em}
.ap-tab.active{background:var(–char);color:var(–gold);border-color:var(–char)}

/* section body */
.ap-body{padding:14px 14px}

/* add btn */
.ap-add-btn{width:100%;border:2px dashed var(–gold);background:var(–gold-bg);color:var(–gold);border-radius:10px;padding:13px;font-size:14px;font-weight:700;cursor:pointer;margin-bottom:12px;letter-spacing:.04em;transition:all .2s}
.ap-add-btn:active{opacity:.7}

/* subcat in admin */
.ap-subcat-lbl{font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(–gold);padding:8px 2px 3px}

/* item card */
.ap-card{background:#fff;border-radius:10px;border:1px solid var(–border);margin-bottom:8px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.ap-card-head{display:flex;align-items:center;gap:8px;padding:11px 12px;cursor:pointer;user-select:none}
.ap-card-head:active{background:#fffbf2}
.ap-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.ap-dot.on{background:var(–green)}
.ap-dot.off{background:#ccc}
.ap-card-info{flex:1;min-width:0}
.ap-card-name{font-size:14px;font-weight:600;color:var(–char);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-card-meta{font-size:11px;color:var(–muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ap-card-price{font-size:14px;font-weight:700;color:var(–rust);white-space:nowrap;margin-right:4px;flex-shrink:0}
.ap-ord-col{display:flex;flex-direction:column;gap:2px;flex-shrink:0}
.ap-ord{background:#f2efe9;border:none;border-radius:5px;width:28px;height:22px;font-size:12px;cursor:pointer;color:#666;display:flex;align-items:center;justify-content:center;font-weight:700}
.ap-ord:active{background:var(–border)}
.ap-ord:disabled{opacity:.2;cursor:default}
.ap-chevron{font-size:14px;color:#bbb;transition:transform .2s;flex-shrink:0}
.ap-card.open .ap-chevron{transform:rotate(90deg)}

/* item form */
.ap-form{display:none;padding:0 12px 14px;border-top:1px solid #f0ebe3}
.ap-card.open .ap-form{display:block}
.ap-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #f5f0e8}
.ap-row span{font-size:14px;font-weight:500}
.ap-tog{width:46px;height:26px;background:#ddd;border-radius:13px;position:relative;cursor:pointer;border:none;transition:background .25s;flex-shrink:0}
.ap-tog.on{background:var(–green)}
.ap-tog::after{content:’’;position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:left .25s;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.ap-tog.on::after{left:23px}
.ap-f{margin-top:10px}
.ap-f label{display:block;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(–muted);margin-bottom:4px}
.ap-f input,.ap-f textarea,.ap-f select{width:100%;border:1.5px solid var(–border);border-radius:8px;padding:10px 12px;font-size:14px;color:var(–char);background:#fff;transition:border-color .2s}
.ap-f input:focus,.ap-f textarea:focus{outline:none;border-color:var(–gold)}
.ap-f textarea{resize:vertical;min-height:54px}
.ap-actions{display:flex;gap:8px;margin-top:12px}
.ap-save{flex:1;background:var(–char);color:#fff;border:none;border-radius:8px;padding:12px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s}
.ap-save:active{background:#333}
.ap-save.ok{background:var(–green)}
.ap-del{background:#fff3f3;color:var(–red);border:1px solid #fcc;border-radius:8px;padding:12px 14px;font-size:13px;font-weight:500;cursor:pointer}

/* ════════════════════════════════════════════
OVERLAYS (PW + QR)
════════════════════════════════════════════ */
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:600;align-items:center;justify-content:center;padding:20px}
.overlay.open{display:flex}

/* pw modal */
.pw-box{background:#fff;border-radius:16px;width:100%;max-width:360px;padding:28px 24px;position:relative}
.pw-box h2{font-family:‘Cormorant Garamond’,serif;font-size:1.5rem;font-weight:600;margin-bottom:4px}
.pw-box p{font-size:13px;color:var(–muted);margin-bottom:18px}
.pw-err{font-size:12px;color:var(–red);margin-top:6px;min-height:18px}
.inp{width:100%;border:1.5px solid var(–border);border-radius:8px;padding:12px 14px;font-size:15px;color:var(–char);background:#fff;transition:border-color .2s}
.inp:focus{outline:none;border-color:var(–gold)}
.btn-row{display:flex;gap:8px;margin-top:14px}
.btn-dark{flex:1;background:var(–char);color:#fff;border:none;border-radius:8px;padding:13px;font-size:14px;font-weight:600;cursor:pointer}
.btn-ghost{background:#f5f0e8;color:var(–mid);border:none;border-radius:8px;padding:13px 18px;font-size:14px;cursor:pointer}
.modal-x{position:absolute;top:14px;right:14px;background:#f5f0e8;border:none;border-radius:50%;width:30px;height:30px;font-size:15px;color:var(–muted);cursor:pointer;display:flex;align-items:center;justify-content:center}

/* qr modal */
.qr-box{background:#fff;border-radius:16px;width:100%;max-width:340px;padding:28px 22px;text-align:center;position:relative}
.qr-box h2{font-family:‘Cormorant Garamond’,serif;font-size:1.4rem;font-weight:600;margin-bottom:4px}
.qr-box p{font-size:12px;color:var(–muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:16px}
.qr-wrap{display:inline-block;padding:14px;background:#fff;border:1px solid var(–border);border-radius:8px;margin-bottom:14px}

/* ════════════════════════════════════════════
TOAST
════════════════════════════════════════════ */
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:24px;font-size:13px;font-weight:500;z-index:900;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1}
</style>

</head>
<body>

<!-- LOADING -->

<div id="loadScreen">
  <div class="load-logo"><span class="load-letter">J</span></div>
  <div class="load-text">Joana Come a Tapa</div>
  <div class="load-bar"><div class="load-bar-inner"></div></div>
</div>

<!-- LANG -->

<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('pt')">PT</button>
  <button class="lang-btn" onclick="setLang('en')">EN</button>
  <button class="lang-btn" onclick="setLang('es')">ES</button>
</div>

<!-- MENU PAGE -->

<div id="menuPage">
  <header class="header">
    <div class="logo-ring"><span class="logo-letter">J</span></div>
    <div class="rest-name">Joana Come a Tapa</div>
    <div class="rest-sub">Petiscaria · Alcochete</div>
    <div class="hline"><span></span><i>✦</i><span></span></div>
  </header>
  <div id="menuRoot"></div>
  <footer class="menu-footer">© Joana Come a Tapa · Alcochete · Portugal</footer>
</div>

<!-- FABS -->

<div class="fabs" id="fabs">
  <button class="fab fab-admin" onclick="openPw()">⚙ Gestão</button>
  <button class="fab fab-qr" onclick="openQR()">◻ QR Code</button>
</div>

<!-- ADMIN PANEL -->

<div id="adminPanel">
  <div class="ap-topbar">
    <div class="ap-title">⚙ Gestão do Menu</div>
    <span class="ap-saved-msg" id="apSavedMsg">✓ Guardado</span>
    <button class="ap-topbtn ap-topbtn-white" onclick="apClose()">✕ Fechar</button>
  </div>
  <div class="ap-tabs" id="apTabs"></div>
  <div id="apBody"></div>
</div>

<!-- PW OVERLAY -->

<div class="overlay" id="pwOverlay">
  <div class="pw-box">
    <button class="modal-x" onclick="closeOv('pwOverlay')">✕</button>
    <h2>Área Admin</h2>
    <p>Introduz a password para gerir o menu</p>
    <input class="inp" type="password" id="pwInput" placeholder="Password" onkeydown="if(event.key==='Enter')checkPw()">
    <div class="pw-err" id="pwErr"></div>
    <div class="btn-row">
      <button class="btn-dark" onclick="checkPw()">Entrar</button>
      <button class="btn-ghost" onclick="closeOv('pwOverlay')">Cancelar</button>
    </div>
  </div>
</div>

<!-- QR OVERLAY -->

<div class="overlay" id="qrOverlay">
  <div class="qr-box">
    <button class="modal-x" onclick="closeOv('qrOverlay')">✕</button>
    <h2>QR Code</h2>
    <p>Partilhar menu</p>
    <input class="inp" type="text" id="qrUrl" placeholder="https://..." oninput="buildQR()" style="margin-bottom:14px">
    <div class="qr-wrap"><div id="qrCanvas"></div></div>
    <div class="btn-row" style="justify-content:center">
      <button class="btn-dark" onclick="dlQR()">⬇ Download PNG</button>
      <button class="btn-ghost" onclick="closeOv('qrOverlay')">Fechar</button>
    </div>
  </div>
</div>

<!-- TOAST -->

<div id="toast"></div>

// ══════════════════════════════════════════════════════════
//  INIT & LOAD
// ══════════════════════════════════════════════════════════
async function init(){
  try {
    // Check if tables have data
    const {data: secData, error: secErr} = await sb.from('menu_sections').select('id').limit(1);

    if(secErr){
      // Tables may not exist yet — show setup message
      showToast('⚠️ Configura a base de dados primeiro', 5000);
      loadFallback();
      return;
    }

    if(!secData || secData.length === 0){
      // Seed the database
      showToast('A configurar base de dados...', 3000);
      await seedDB();
    }

    await loadFromDB();
    setupRealtime();

  } catch(e) {
    console.error(e);
    loadFallback();
  } finally {
    setTimeout(()=>{
      document.getElementById('loadScreen').classList.add('fade');
      setTimeout(()=>document.getElementById('loadScreen').style.display='none', 400);
    }, 1000);
  }
}

async function seedDB(){
  await sb.from('menu_sections').upsert(SEED_SECTIONS);
  // Insert items in batches of 50
  for(let i=0; i<SEED_ITEMS.length; i+=50){
    await sb.from('menu_items').upsert(SEED_ITEMS.slice(i,i+50));
  }
}

async function loadFromDB(){
  const {data: secs} = await sb.from('menu_sections').select('*').order('sort_order');
  const {data: itms} = await sb.from('menu_items').select('*').order('sort_order');
  sections = secs || [];
  items = itms || [];
  dbReady = true;
  renderMenu();
}

function loadFallback(){
  // Use seed data as fallback if DB fails
  sections = SEED_SECTIONS.map(s => ({...s}));
  items = SEED_ITEMS.map(i => ({...i}));
  renderMenu();
}

function setupRealtime(){
  sb.channel('menu-changes')
    .on('postgres_changes', {event:'*', schema:'public', table:'menu_sections'}, ()=>loadFromDB())
    .on('postgres_changes', {event:'*', schema:'public', table:'menu_items'}, ()=>loadFromDB())
    .subscribe();
}

// ══════════════════════════════════════════════════════════
//  RENDER MENU
// ══════════════════════════════════════════════════════════
function renderMenu(){
  const root = document.getElementById('menuRoot');
  root.innerHTML = '';

  sections.forEach(sec => {
    const secItems = items.filter(i => i.section_id === sec.id).sort((a,b)=>a.sort_order-b.sort_order);
    if(!secItems.length) return;

    const block = document.createElement('div');
    block.className = 'sec-block';

    const nameKey = 'name_'+lang, subKey = 'sub_'+lang;
    block.innerHTML = '<div class="sec-header"><span class="sec-icon">'+sec.icon+'</span><div><div class="sec-name">'+(sec[nameKey]||sec.name_pt)+'</div><div class="sec-sub">'+(sec[subKey]||sec.sub_pt)+'</div></div></div>';

    let lastSub = null;
    secItems.forEach(item => {
      if(item.subcat && item.subcat !== lastSub){
        lastSub = item.subcat;
        const sl = document.createElement('div');
        sl.className = 'subcat-label';
        sl.textContent = item.subcat;
        block.appendChild(sl);
      }
      const descKey = 'desc_'+lang;
      const desc = item[descKey] || item.desc_pt || '';
      const unavailLabel = lang==='en'?'— not available':lang==='es'?'— no disponible':'— indisponível';

      const div = document.createElement('div');
      div.className = 'menu-item' + (item.avail?'':' unavail');
      div.innerHTML =
        '<div class="mi-left">' +
          '<div class="mi-name">' + item.name + (!item.avail?' <span class="mi-unavail">'+unavailLabel+'</span>':'') + '</div>' +
          (desc?'<div class="mi-desc">'+desc+'</div>':'') +
          (item.allergens?'<div class="mi-allerg">⚠ '+item.allergens+'</div>':'') +
        '</div>' +
        '<div class="mi-price">' + item.price + '</div>';
      block.appendChild(div);
    });

    root.appendChild(block);
  });
}

function apSetTab(i){ apTab=i; apRender(); document.getElementById(‘apTabs’).children[i].scrollIntoView({behavior:‘smooth’,inline:‘center’}); }

function apTogCard(id){
const el = document.getElementById(‘apc_’+id);
// Close others
document.querySelectorAll(’.ap-card.open’).forEach(e=>{ if(e!==el) e.classList.remove(‘open’); });
el.classList.toggle(‘open’);
if(el.classList.contains(‘open’)) el.scrollIntoView({behavior:‘smooth’,block:‘nearest’});
}

function apTogAvail(id){
const item = items.find(x=>x.id===id);
if(!item) return;
item.avail = !item.avail;
const tog = document.getElementById(‘tog_’+id);
const dot = document.querySelector(’#apc_’+id+’ .ap-dot’);
if(tog) tog.classList.toggle(‘on’, item.avail);
if(dot){ dot.classList.toggle(‘on’, item.avail); dot.classList.toggle(‘off’, !item.avail); }
}

async function apSaveItem(id){
const item = items.find(x=>x.id===id);
if(!item) return;
item.name = document.getElementById(‘apn_’+id).value.trim();
item.price = document.getElementById(‘app_’+id).value.trim();
item.subcat = document.getElementById(‘aps_’+id).value.trim();
const d = document.getElementById(‘apd_’+id).value;
item.desc_pt = d; item.desc_en = d; item.desc_es = d;
item.allergens = document.getElementById(‘apa_’+id).value.trim();

const btn = document.getElementById(‘apsv_’+id);
btn.textContent = ‘…’;
btn.disabled = true;

if(dbReady){
const {error} = await sb.from(‘menu_items’).upsert({
id: item.id, section_id: item.section_id,
name: item.name, price: item.price, subcat: item.subcat,
desc_pt: item.desc_pt, desc_en: item.desc_en, desc_es: item.desc_es,
allergens: item.allergens, avail: item.avail, sort_order: item.sort_order
});
if(error){ showToast(’Erro ao guardar: ’+error.message); }
else { showToast(‘✓ Guardado na cloud!’); }
}

btn.textContent = ‘✓ Guardado!’;
btn.classList.add(‘ok’);
setTimeout(()=>{ btn.textContent=‘✓ Guardar alterações’; btn.classList.remove(‘ok’); btn.disabled=false; apRender(); }, 1500);
}

async function apDelItem(id){
if(!confirm(‘Apagar este item?’)) return;
items = items.filter(x=>x.id!==id);
if(dbReady) await sb.from(‘menu_items’).delete().eq(‘id’,id);
showToast(‘Item apagado’);
apRender();
}

async function apMoveUp(e, id){
e.stopPropagation();
const sec = sections[apTab];
const secItems = items.filter(x=>x.section_id===sec.id).sort((a,b)=>a.sort_order-b.sort_order);
const idx = secItems.findIndex(x=>x.id===id);
if(idx<=0) return;
const a = secItems[idx], b2 = secItems[idx-1];
[a.sort_order, b2.sort_order] = [b2.sort_order, a.sort_order];
if(dbReady){
await sb.from(‘menu_items’).upsert([{id:a.id,sort_order:a.sort_order,section_id:a.section_id,name:a.name,price:a.price,subcat:a.subcat,desc_pt:a.desc_pt,desc_en:a.desc_en,desc_es:a.desc_es,allergens:a.allergens,avail:a.avail},{id:b2.id,sort_order:b2.sort_order,section_id:b2.section_id,name:b2.name,price:b2.price,subcat:b2.subcat,desc_pt:b2.desc_pt,desc_en:b2.desc_en,desc_es:b2.desc_es,allergens:b2.allergens,avail:b2.avail}]);
}
apRender();
}

async function apMoveDown(e, id){
e.stopPropagation();
const sec = sections[apTab];
const secItems = items.filter(x=>x.section_id===sec.id).sort((a,b)=>a.sort_order-b.sort_order);
const idx = secItems.findIndex(x=>x.id===id);
if(idx>=secItems.length-1) return;
const a = secItems[idx], b2 = secItems[idx+1];
[a.sort_order, b2.sort_order] = [b2.sort_order, a.sort_order];
if(dbReady){
await sb.from(‘menu_items’).upsert([{id:a.id,sort_order:a.sort_order,section_id:a.section_id,name:a.name,price:a.price,subcat:a.subcat,desc_pt:a.desc_pt,desc_en:a.desc_en,desc_es:a.desc_es,allergens:a.allergens,avail:a.avail},{id:b2.id,sort_order:b2.sort_order,section_id:b2.section_id,name:b2.name,price:b2.price,subcat:b2.subcat,desc_pt:b2.desc_pt,desc_en:b2.desc_en,desc_es:b2.desc_es,allergens:b2.allergens,avail:b2.avail}]);
}
apRender();
}

async function apAddItem(secId){
const sec = sections.find(x=>x.id===secId);
const secItems = items.filter(x=>x.section_id===secId);
const newItem = {
id: ‘x’+Math.random().toString(36).slice(2,10),
section_id: secId,
subcat: ‘’,
name: ‘Novo item’,
desc_pt:’’, desc_en:’’, desc_es:’’,
price: ‘0€’,
allergens: ‘’,
avail: true,
sort_order: secItems.length + 1
};
items.push(newItem);
if(dbReady) await sb.from(‘menu_items’).insert(newItem);
apRender();
setTimeout(()=>{
const el = document.getElementById(‘apc_’+newItem.id);
if(el){ el.classList.add(‘open’); el.scrollIntoView({behavior:‘smooth’,block:‘center’}); }
}, 100);
}

let qrInst = null;
function openQR(){
document.getElementById(‘qrOverlay’).classList.add(‘open’);
const inp = document.getElementById(‘qrUrl’);
if(!inp.value) inp.value = window.location.href !== ‘about:blank’ ? window.location.href : ‘’;

}
function buildQR(){
const url = document.getElementById(‘qrUrl’).value || ‘https://joanacomeatapa.netlify.app’;
const c = document.getElementById(‘qrCanvas’);
c.innerHTML = ‘’;
new QRCode(c,{text:url,width:180,height:180,colorDark:’#1a1a1a’,colorLight:’#ffffff’,correctLevel:QRCode.CorrectLevel.H});
}
function dlQR(){
const canvas = document.querySelector(’#qrCanvas canvas’);
const img = document.querySelector(’#qrCanvas img’);
const a = document.createElement(‘a’);
a.href = canvas ? canvas.toDataURL(‘image/png’) : img?.src;
a.download = ‘jcat-qrcode.png’;
a.click();
}

let toastTimer;

const t = document.getElementById(‘toast’);
t.textContent = msg;
t.classList.add(‘show’);
clearTimeout(toastTimer);
toastTimer = setTimeout(()=>t.classList.remove(‘show’), dur);
}
